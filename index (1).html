<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UZAIRUE</title>
<style>
:root{--bg:#060a13;--card:#0d1424;--ink:#eef6ff;--mute:#8fa3bd;--acc:#00e5ff;--acc2:#8b5cf6;--line:rgba(0,229,255,.28);--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#1a1140 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:rgba(6,10,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.16em;color:var(--acc);font-size:20px;cursor:pointer;text-shadow:0 0 12px rgba(0,229,255,.6)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
main{max-width:920px;margin:0 auto;padding:16px 14px 70px}
h2{margin:26px 0 10px;font-size:20px}
.hero{border:1px solid var(--line);border-radius:18px;padding:26px 18px;background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(139,92,246,.16));box-shadow:0 0 28px rgba(0,229,255,.15)}
.hero h1{margin:0 0 6px;font-size:30px;letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 0 14px rgba(0,229,255,.1)}
.card h3{margin:0 0 4px;font-size:17px}
.mute{color:var(--mute);font-size:14px}
button,.btn{font:inherit;border:1px solid var(--line);background:#101a30;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.p,.btn.p{background:var(--acc);color:#02141a;border-color:var(--acc);font-weight:700;box-shadow:0 0 14px rgba(0,229,255,.4)}
button.d{color:var(--bad)}button.on{border-color:var(--acc);color:var(--acc);background:rgba(0,229,255,.14);box-shadow:0 0 10px rgba(0,229,255,.35)}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#080e1c;color:var(--ink);margin:4px 0 10px}
label{font-size:14px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#16284a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:var(--acc);overflow:hidden;flex:none;border:1px solid var(--line)}
.mem{text-align:center}.mem .av{margin:0 auto 8px;width:84px;height:84px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#16284a;color:var(--mute)}
.tag.a{background:var(--acc);color:#02141a}
.bar{height:10px;border-radius:99px;background:#16284a;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--acc)}
.msg{padding:10px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
.narrow{max-width:430px;margin:0 auto}
.thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.king{display:flex;gap:14px;align-items:center;border-color:var(--acc);box-shadow:0 0 22px rgba(0,229,255,.3)}
.king .av{width:96px;height:96px}
canvas{max-width:100%;height:auto;border-radius:14px;box-shadow:0 0 22px rgba(0,229,255,.3)}
.big{font-size:26px;font-weight:800;color:var(--acc)}
</style>
</head>
<body>
<header><span class="logo" onclick="go('home')">UZAIRUE</span><nav id="nav"></nav></header>
<main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,runTransaction,query,orderBy,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1) Paste your Firebase web app config here (Firebase console > Project settings > Your apps)
const cfg={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};

const cfgOk=!cfg.apiKey.startsWith("YOUR");
let auth,db;if(cfgOk){const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app)}
const $=id=>document.getElementById(id);
const v=id=>($(id)?.value||'').trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=u=>/^https?:\/\//i.test(u)?u:'';
const S={user:null,me:null,view:'home',tab:'dash',vil:[],news:[],proj:[],coun:[],mem:[],don:[],q:'',vf:'',msg:'',img:'',card:null};
const isAdmin=()=>S.me&&S.me.role==='admin';
const say=m=>{S.msg=m;render()};
const go=x=>{S.view=x;S.msg='';S.card=null;S.sec='';render()};
const jump=id=>{S.sec=id;const f=()=>$(id)&&$(id).scrollIntoView({behavior:'smooth'});if(S.view==='home'&&!S.msg){nav();f()}else{S.view='home';S.msg='';S.card=null;render();setTimeout(f,50)}};
async function list(c,o){try{const s=await getDocs(o?query(collection(db,c),orderBy(o)):collection(db,c));return s.docs.map(d=>({_id:d.id,...d.data()}))}catch(e){return[]}}
async function loadPub(){if(!cfgOk)return;S.news=(await list('news','at')).reverse();S.proj=await list('projects');S.vil=await list('villages');S.coun=S.user?await list('council'):[]}
async function loadAdmin(){S.mem=await list('members','createdAt');S.don=(await list('donations','at')).reverse()}
async function reload(){await loadPub();if(isAdmin())await loadAdmin();render()}
async function nextId(){return runTransaction(db,async tx=>{const r=doc(db,'meta','counter'),s=await tx.get(r),n=(s.exists()?s.data().n:0)+1;tx.set(r,{n});return 'UCA-'+String(n).padStart(4,'0')})}

if(cfgOk)onAuthStateChanged(auth,async u=>{S.user=u;S.me=null;if(u){try{const d=await getDoc(doc(db,'members',u.uid));if(d.exists())S.me={_id:d.id,...d.data()}}catch(e){}}await reload()});
else render();

const vopts=sel=>(S.vil.length?S.vil.map(x=>x.name):['Jattu']).map(n=>'<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>').join('');
const av=m=>m.img?'<img class="av" src="'+m.img+'" alt="">':'<div class="av">'+esc((m.name||'?').charAt(0).toUpperCase())+'</div>';
const titleOf=m=>(S.coun.filter(c=>c.memberId===m.id)[0]||{}).title||'';

function nav(){
  let h='<button onclick="go(\'home\')">Home</button><button onclick="jump(\'news\')">News</button><button onclick="jump(\'projects\')">Projects</button><button onclick="jump(\'donate\')">Donate</button>';
  if(!S.user)h+='<button class="p" onclick="go(\'login\')">Sign up / Log in</button>';
  else{h+='<button onclick="go(\'council\')">Council</button><button onclick="go(\'me\')">My profile</button>';if(isAdmin())h+='<button onclick="go(\'admin\')">Admin</button>';h+='<button onclick="out()">Log out</button>'}
  $('nav').innerHTML=h;const cur=S.view==='home'?(S.sec||'home'):S.view;[...$('nav').children].forEach(b=>{const m=(b.getAttribute('onclick')||'').match(/'(\w+)'/);const k=m?m[1]:(b.textContent.includes('Log in')?'login':'');if(k===cur||(cur==='signup'&&k==='login'))b.classList.add('on')})}
function render(){
  nav();
  let h=S.msg?'<div class="msg">'+esc(S.msg)+'</div>':'';
  if(!cfgOk)h+='<div class="card"><h3>Setup needed</h3><p>Paste your Firebase config into <b>index.html</b> (see the setup steps), then reload.</p></div>';
  const V={home,login,signup,council,me:profile,admin};
  h+=(V[S.view]||home)();
  $('app').innerHTML=h;
  if(S.view==='me'&&(S.card||S.me))drawCard(S.card||S.me,'cv');
  if(S.view==='login'||S.view==='signup'||S.view==='home')window.scrollTo(0,0)}

const pct=p=>p.target>0?Math.min(100,Math.round((p.raised||0)/p.target*100)):0;
function home(){
  let h='<div class="hero"><h1>UZAIRUE</h1><p>One community, one future. Follow our news, back our projects and join the family.</p><div class="row"><button class="p" onclick="jump(\'donate\')">Support a project</button>'+(S.user?'':'<button onclick="go(\'signup\')">Join now</button>')+'</div></div>';
  h+='<h2 id="news">Announcements &amp; News</h2><div class="grid">';
  if(!S.news.length)h+='<div class="card mute">No news yet.</div>';
  S.news.forEach(n=>{h+='<div class="card">'+(ok(n.img)?'<img class="thumb" src="'+esc(n.img)+'" alt="">':'')+'<h3>'+esc(n.title)+'</h3><p>'+esc(n.body)+'</p></div>'});
  h+='</div><h2 id="projects">Projects &amp; Progress</h2><div class="grid">';
  if(!S.proj.length)h+='<div class="card mute">No projects yet.</div>';
  S.proj.forEach(p=>{h+='<div class="card"><h3>'+esc(p.title)+'</h3><p class="mute">'+esc(p.body)+'</p><div class="bar"><i style="width:'+pct(p)+'%"></i></div><div class="mute">'+pct(p)+'% · ₦'+(p.raised||0).toLocaleString()+' of ₦'+(p.target||0).toLocaleString()+'</div>'+(ok(p.link)?'<div class="row"><a class="btn p" href="'+esc(p.link)+'" target="_blank" rel="noopener">Donate</a></div>':'')+'</div>'});
  return h+'</div><h2 id="donate">Support the community</h2><div class="card">Every contribution moves a project forward. Use the Donate button on any project above.</div>'}

const login=()=>'<div class="card narrow"><h3>Log in</h3><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><button class="p" onclick="doLogin()">Log in</button> <button onclick="go(\'signup\')">Create account</button></div>';
const signup=()=>'<div class="card narrow"><h3>Join UZAIRUE</h3><label>Full name</label><input id="sn"><label>Email (required)</label><input id="se" type="email"><label>Password (6+ characters)</label><input id="sp" type="password"><label>Mobile number</label><input id="sm" type="tel"><label>House number</label><input id="sh"><label>Village</label><select id="sv">'+vopts()+'</select><label>Profile photo</label><input type="file" accept="image/*" onchange="pick(this)"><button class="p" onclick="doSignup()">Create account</button></div>';
function pick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height);c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.img=c.toDataURL('image/jpeg',.8);if(S.view==='me'&&S.me){updateDoc(doc(db,'members',S.me._id),{img:S.img}).then(()=>{S.me.img=S.img;S.img='';render()})}};im.src=r.result};r.readAsDataURL(f)}
async function doLogin(){try{await signInWithEmailAndPassword(auth,v('le'),$('lp').value);S.view='home';S.msg=''}catch(e){say('Login failed: check your email and password.')}}
async function doSignup(){
  const n=v('sn'),e=v('se'),p=$('sp').value;
  if(!n||!e||p.length<6)return say('Name, email and a 6+ character password are required.');
  try{const c=await createUserWithEmailAndPassword(auth,e,p),id=await nextId();
    await setDoc(doc(db,'members',c.user.uid),{id,name:n,email:e,phone:v('sm'),house:v('sh'),village:v('sv'),role:'member',status:'active',img:S.img,createdAt:serverTimestamp()});
    S.me={_id:c.user.uid,id,name:n,email:e,phone:v('sm'),house:v('sh'),village:v('sv'),role:'member',status:'active',img:S.img};S.img='';S.view='me';S.msg='Welcome! Your member ID is '+id+'.';await loadPub();render()}catch(x){say(x.message)}}
async function out(){await signOut(auth);S.view='home'}

function profile(){
  const m=S.card||S.me;if(!m)return '<div class="card">Your profile is not available. If you were registered by an admin without an email, ask the admin to view it for you.</div>';
  const t=titleOf(m);
  return '<div class="card" style="display:flex;gap:14px;align-items:center">'+av(m)+'<div><h3>'+esc(m.name)+'</h3>'+(t?'<span class="tag a">'+esc(t)+'</span> ':'')+'<div class="big">'+esc(m.id)+'</div><div class="mute">'+esc(m.village)+' · House '+esc(m.house||'-')+'</div><div class="mute">'+esc(m.phone||'')+' '+esc(m.email||'')+'</div></div></div><h2>Digital ID card</h2><canvas id="cv"></canvas><div class="row"><button class="p" onclick="dl()">Download ID</button></div>'+(S.card?'':'<h2>Update photo</h2><input type="file" accept="image/*" onchange="pick(this)">')}
function drawCard(m,id){
  const c=$(id);if(!c)return;const x=c.getContext('2d'),W=c.width=640,H=c.height=400,t=titleOf(m);
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#08182f');g.addColorStop(1,'#1e1042');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#00e5ff';x.lineWidth=3;x.strokeRect(8,8,W-16,H-16);
  x.save();x.globalAlpha=.07;x.translate(W/2,H/2);x.rotate(-.4);x.fillStyle='#00e5ff';x.font='bold 96px sans-serif';x.textAlign='center';x.fillText('UZAIRUE',0,30);x.restore();
  x.textAlign='left';x.fillStyle='#00e5ff';x.font='bold 26px sans-serif';x.fillText('UZAIRUE MEMBER',30,56);
  x.fillStyle='#fff';x.font='bold 34px sans-serif';x.fillText(m.name||'',210,160);
  x.font='bold 26px monospace';x.fillStyle='#7df9ff';x.fillText(m.id||'',210,205);
  x.font='20px sans-serif';x.fillStyle='#cfe';x.fillText('Village: '+(m.village||''),210,245);x.fillText('House: '+(m.house||'-'),210,275);x.fillText('Phone: '+(m.phone||'-'),210,305);
  if(t){x.fillStyle='#ffd166';x.fillText(t,210,335)}
  x.fillStyle=m.status==='revoked'?'#ff6b6b':'#4cffa6';x.font='bold 20px sans-serif';x.fillText(m.status==='revoked'?'REVOKED':'ACTIVE',210,372);
  x.fillStyle='#16284a';x.fillRect(30,110,150,150);
  if(m.img){const i=new Image();i.onload=()=>x.drawImage(i,30,110,150,150);i.src=m.img}else{x.fillStyle='#7df9ff';x.font='bold 70px sans-serif';x.textAlign='center';x.fillText((m.name||'?')[0],105,215)}}
function dl(){const c=$('cv'),a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=((S.card||S.me).id||'ID')+'.png';a.click()}

function council(){
  const by=l=>S.coun.filter(c=>c.level===l).sort((a,b)=>(a.rank||99)-(b.rank||99));
  const person=c=>'<div class="card mem">'+av(c)+'<h3>'+esc(c.name)+'</h3><span class="tag a">'+esc(c.title)+'</span></div>';
  const k=by('kingdom');let h='<h2>Traditional Council</h2>';
  if(!k.length)h+='<div class="card mute">The council has not been added yet.</div>';
  if(k[0])h+='<div class="card king">'+av(k[0])+'<div><div class="mute">Seat: Jattu</div><h3>'+esc(k[0].name)+'</h3><span class="tag a">'+esc(k[0].title)+'</span></div></div>';
  if(k.length>1)h+='<h2>The King’s Entourage</h2><div class="grid">'+k.slice(1).map(person).join('')+'</div>';
  S.vil.forEach(vl=>{const l=by(vl.name);if(l.length)h+='<h2>'+esc(vl.name)+'</h2><div class="grid">'+l.map(person).join('')+'</div>'});
  return h}

function memCards(){
  const q=S.q.toLowerCase();
  const L=S.mem.filter(m=>(!S.vf||m.village===S.vf)&&(!q||(m.name+' '+m.id+' '+(m.email||'')).toLowerCase().includes(q)));
  return L.map(m=>'<div class="card mem">'+av(m)+'<h3>'+esc(m.name)+'</h3><div class="mute">'+esc(m.id)+' · '+esc(m.village)+'<br>'+esc(m.email||'No email (admin-managed)')+'</div><span class="tag '+(m.role==='admin'?'a':'')+'">'+m.role+'</span> <span class="tag">'+(m.status||'active')+'</span><div class="row" style="justify-content:center"><button onclick="showCard(\''+m._id+'\')">ID card</button><button onclick="toggle(\''+m._id+'\',\'status\')">'+(m.status==='revoked'?'Restore':'Revoke')+'</button><button onclick="reissue(\''+m._id+'\')">Re-issue ID</button>'+(m._id===S.me._id?'':'<button onclick="toggle(\''+m._id+'\',\'role\')">'+(m.role==='admin'?'Make member':'Make admin')+'</button><button class="d" onclick="del(\'members\',\''+m._id+'\')">Remove</button>')+'</div></div>').join('')||'<div class="card mute">No members found.</div>'}
function admin(){
  if(!isAdmin())return '<div class="card">Admins only.</div>';
  const T=['dash','members','villages','council','news','projects','donations'];
  let h='<h2>Admin</h2><div class="tabs">'+T.map(t=>'<button class="'+(S.tab===t?'on':'')+'" onclick="S.tab=\''+t+'\';render()">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div>';
  const t=S.tab;
  if(t==='dash'){const tot=S.don.reduce((s,d)=>s+d.amount,0),ne=S.mem.filter(m=>!m.email).length;
    h+='<div class="grid">'+[['Members',S.mem.length],['Projects',S.proj.length],['Donations','₦'+tot.toLocaleString()],['No-email members',ne]].map(a=>'<div class="card"><div class="mute">'+a[0]+'</div><div class="big">'+a[1]+'</div></div>').join('')+'</div><h2>Project funding</h2><div class="grid">'+S.proj.map(p=>'<div class="card"><h3>'+esc(p.title)+'</h3><div class="bar"><i style="width:'+pct(p)+'%"></i></div><div class="mute">'+pct(p)+'%</div></div>').join('')+'</div>'}
  if(t==='members')h+='<div class="card"><h3>Register a member</h3><label>Full name</label><input id="an"><label>Mobile</label><input id="ap"><label>House number</label><input id="ah"><label>Village</label><select id="av">'+vopts()+'</select><label>Email (optional)</label><input id="ae" type="email"><label>Photo</label><input type="file" accept="image/*" onchange="pick(this)"><button class="p" onclick="addMember()">Register</button></div><h2>Directory</h2><input placeholder="Search name, ID or email" oninput="S.q=this.value;$(\'ml\').innerHTML=memCards()"><select onchange="S.vf=this.value;$(\'ml\').innerHTML=memCards()"><option value="">All villages</option>'+S.vil.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><div class="grid" id="ml">'+memCards()+'</div>';
  if(t==='villages')h+='<div class="card"><h3>Add village</h3><input id="vn" placeholder="e.g. Jattu"><button class="p" onclick="addSimple(\'villages\',{name:v(\'vn\')},\'vn\')">Add</button></div><div class="grid">'+S.vil.map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><button class="d" onclick="del(\'villages\',\''+x._id+'\')">Delete</button></div>').join('')+'</div>';
  if(t==='council')h+='<div class="card"><h3>Add council member</h3><label>Name</label><input id="cn"><label>Title (e.g. King, Prime Minister, Village Head)</label><input id="ct"><label>Level</label><select id="cl"><option value="kingdom">Kingdom of Uzairue (Jattu)</option>'+S.vil.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><label>Rank (1 = top)</label><input id="cr" type="number" value="1"><label>Linked member ID (optional, e.g. UCA-0002)</label><input id="cm"><label>Photo</label><input type="file" accept="image/*" onchange="pick(this)"><button class="p" onclick="addCouncil()">Add</button></div><h2>Council</h2><div class="grid">'+S.coun.slice().sort((a,b)=>(a.rank||99)-(b.rank||99)).map(c=>'<div class="card mem">'+av(c)+'<h3>'+esc(c.name)+'</h3><span class="tag a">'+esc(c.title)+'</span><div class="mute">'+(c.level==='kingdom'?'Kingdom':esc(c.level))+' · rank '+esc(c.rank)+'</div><button class="d" onclick="del(\'council\',\''+c._id+'\')">Delete</button></div>').join('')+'</div>';
  if(t==='news')h+='<div class="card"><h3>Post news</h3><label>Title</label><input id="nt"><label>Story</label><textarea id="nb" rows="3"></textarea><label>Image URL (optional)</label><input id="ni"><button class="p" onclick="addSimple(\'news\',{title:v(\'nt\'),body:v(\'nb\'),img:ok(v(\'ni\')),at:serverTimestamp()},\'nt\')">Publish</button></div><div class="grid">'+S.news.map(n=>'<div class="card"><h3>'+esc(n.title)+'</h3><p class="mute">'+esc(n.body)+'</p><button class="d" onclick="del(\'news\',\''+n._id+'\')">Delete</button></div>').join('')+'</div>';
  if(t==='projects')h+='<div class="card"><h3>Create project</h3><label>Title</label><input id="pt"><label>Description</label><textarea id="pb" rows="2"></textarea><label>Target amount (₦)</label><input id="pg" type="number"><label>Donation link (https://…)</label><input id="pl"><button class="p" onclick="addSimple(\'projects\',{title:v(\'pt\'),body:v(\'pb\'),target:+v(\'pg\')||0,raised:0,link:ok(v(\'pl\'))},\'pt\')">Create</button></div><div class="grid">'+S.proj.map(p=>'<div class="card"><h3>'+esc(p.title)+'</h3><div class="bar"><i style="width:'+pct(p)+'%"></i></div><div class="mute">₦'+(p.raised||0).toLocaleString()+' / ₦'+(p.target||0).toLocaleString()+'</div><div class="row"><button onclick="editTarget(\''+p._id+'\','+(p.target||0)+')">Set target</button><button class="d" onclick="del(\'projects\',\''+p._id+'\')">Delete</button></div></div>').join('')+'</div>';
  if(t==='donations')h+='<div class="card"><h3>Log a donation</h3><label>Donor (name, or “Anonymous”)</label><input id="dn"><label>Amount (₦)</label><input id="da" type="number"><label>Project</label><select id="dp">'+S.proj.map(p=>'<option value="'+p._id+'">'+esc(p.title)+'</option>').join('')+'</select><button class="p" onclick="addDon()">Record</button></div><h2>Log</h2><div class="grid">'+(S.don.map(d=>'<div class="card"><div class="big">₦'+d.amount.toLocaleString()+'</div><div>'+esc(d.project)+'</div><div class="mute">'+esc(d.donor)+'</div></div>').join('')||'<div class="card mute">No donations yet.</div>')+'</div>';
  return h}

async function addMember(){const n=v('an');if(!n)return say('Name is required.');try{const id=await nextId();await addDoc(collection(db,'members'),{id,name:n,phone:v('ap'),house:v('ah'),village:v('av'),email:v('ae'),role:'member',status:'active',img:S.img,byAdmin:true,createdAt:serverTimestamp()});S.img='';await reload();say('Registered '+id)}catch(e){say(e.message)}}
async function addSimple(c,d,k){if(!v(k))return say('Please fill in the first field.');try{await addDoc(collection(db,c),d);await reload()}catch(e){say(e.message)}}
async function addCouncil(){if(!v('cn')||!v('ct'))return say('Name and title are required.');try{await addDoc(collection(db,'council'),{name:v('cn'),title:v('ct'),level:v('cl'),rank:+v('cr')||99,memberId:v('cm').toUpperCase(),img:S.img});S.img='';await reload()}catch(e){say(e.message)}}
async function addDon(){const a=+v('da'),pid=v('dp'),p=S.proj.filter(x=>x._id===pid)[0];if(!p||!(a>0))return say('Choose a project and amount.');try{await addDoc(collection(db,'donations'),{donor:v('dn')||'Anonymous',amount:a,pid,project:p.title,at:serverTimestamp()});await updateDoc(doc(db,'projects',pid),{raised:increment(a)});await reload()}catch(e){say(e.message)}}
async function editTarget(id,t){const n=prompt('Target amount (₦)',t);if(n===null)return;await updateDoc(doc(db,'projects',id),{target:+n||0});reload()}
async function del(c,id){if(!confirm('Delete this?'))return;await deleteDoc(doc(db,c,id));reload()}
async function toggle(id,f){const m=S.mem.filter(x=>x._id===id)[0],val=f==='role'?(m.role==='admin'?'member':'admin'):(m.status==='revoked'?'active':'revoked');await updateDoc(doc(db,'members',id),{[f]:val});reload()}
async function reissue(id){if(!confirm('Give this member a new ID?'))return;const n=await nextId();await updateDoc(doc(db,'members',id),{id:n,status:'active'});reload()}
function showCard(id){S.card=S.mem.filter(x=>x._id===id)[0];S.view='me';render()}

window.addEventListener('scroll',()=>{if(S.view!=='home')return;let k='';for(const id of ['news','projects','donate']){const e=$(id);if(e&&e.getBoundingClientRect().top<120)k=id}if(k!==(S.sec||'')){S.sec=k;nav()}},{passive:true});
Object.assign(window,{S,go,jump,out,doLogin,doSignup,pick,dl,memCards,addMember,addSimple,addCouncil,addDon,editTarget,del,toggle,reissue,showCard,render,$,v,ok,serverTimestamp});
</script>
</body>
</html>
